<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - TOKO ERA DIGITAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        :root{--primary:#D2691E;--primary-dark:#8B4513;--bg:#FDF6EC;--bg-card:#FFF;--text:#1A1A2E;--text-muted:#6B7280;--success:#10B981;--error:#EF4444;--shadow:0 4px 24px rgba(0,0,0,.06);--radius:16px}
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;overflow-x:hidden}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
        .card{background:var(--bg-card);border-radius:var(--radius);padding:28px 24px;box-shadow:var(--shadow);width:100%;max-width:440px}
        .back{display:inline-block;margin-bottom:20px;text-decoration:none;color:var(--primary-dark);font-weight:600;font-size:.88rem}
        .back:hover{text-decoration:underline}
        h1{font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:6px}
        .sub{text-align:center;color:var(--text-muted);font-size:.88rem;margin-bottom:20px}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px}
        .form-group input{width:100%;padding:12px 14px;border:2px solid #E5E7EB;border-radius:10px;font-size:.95rem;font-family:inherit;background:var(--bg);transition:border .2s}
        .form-group input:focus{outline:none;border-color:var(--primary)}
        .btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;transition:background .2s}
        .btn:hover{background:var(--primary-dark)}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .alert{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:.86rem;display:none}
        .alert.show{display:block}
        .alert.error{background:#FEE2E2;color:#DC2626;border:1px solid #FECACA}
        .alert.success{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0}
        .alert.info{background:#DBEAFE;color:#1E40AF;border:1px solid #BFDBFE}
        .help{text-align:center;margin-top:18px;font-size:.85rem;color:var(--text-muted)}
        .help a{color:var(--primary-dark);text-decoration:none;font-weight:600}
        .help a:hover{text-decoration:underline}
        .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:768px){input{font-size:16px}}
    </style>
</head>
<body>
    <div class="card">
        <a href="/login" class="back">&larr; Kembali ke Login</a>
        <h1>🔑 Lupa Password?</h1>
        <p class="sub">Masukkan email Sobat. Kami kirim link reset password ke inbox email.</p>

        <div id="alertBox" class="alert"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Email Sobat</label>
                <input type="email" id="email" placeholder="sobat@example.com" required autocomplete="email">
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">📧 Kirim Link Reset Password</span>
            </button>
        </form>

        <div class="help">
            Belum punya akun? <a href="/register">Daftar Sobat</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        function showAlert(type, msg) {
            alertBox.className = 'alert show ' + type;
            alertBox.textContent = msg;
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            if (loading) {
                btnText.innerHTML = '<span class="spinner"></span>Mengirim email...';
            } else {
                btnText.textContent = '📧 Kirim Link Reset Password';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showAlert('error', 'Email wajib diisi');
                return;
            }
            setLoading(true);
            try {
                // Send password reset email — link will redirect to /reset-password
                const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password'
                });
                if (error) throw error;

                showAlert('success',
                    '✓ Link reset password sudah dikirim ke email Sobat. ' +
                    'Cek inbox (dan folder spam jika tidak ada). ' +
                    'Link berlaku 1 jam.'
                );
                form.reset();
            } catch (err) {
                console.error('Reset password request failed', err);
                let msg = err.message || 'Gagal mengirim email reset';
                if (msg.includes('rate limit') || msg.includes('too many')) {
                    msg = 'Terlalu banyak permintaan. Tunggu beberapa menit sebelum coba lagi.';
                } else if (msg.includes('not found') || msg.includes('no user')) {
                    // Supabase returns generic error — don't leak if email exists
                    msg = 'Jika email Sobat terdaftar, link reset sudah dikirim.';
                }
                showAlert('error', msg);
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
